name: Multi-OS Testing - Bilal

on:
  push:
    branches:
      - main

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Print start message
        run: echo "Testing on Ubuntu..."
      - name: Display OS info
        run: lsb_release -a || cat /etc/os-release
      - name: Create test file
        run: echo "Ubuntu test by Bilal" > test-ubuntu.txt
      - name: Show file content
        run: cat test-ubuntu.txt
      - name: Print end message
        run: echo "Ubuntu tests completed"

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Print start message
        run: echo "Testing on Windows..."
      - name: Display OS info
        run: systeminfo | findstr /B /C:"OS"
      - name: Create test file
        run: echo "Windows test by Bilal" > test-windows.txt
      - name: Show file content
        run: type test-windows.txt
      - name: Print end message
        run: echo "Windows tests completed"
